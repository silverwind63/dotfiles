# More option see https://github.com/DreamMaoMao/mango/wiki/
exec-once=awww-daemon
exec-once=./Waybar/build/waybar -c ./.config/waybar/mango/config.jsonc -s ./.config/waybar/mango/style.css
exec-once=fcitx5
exec-once=wl-paste --type text image --watch cliphist store
exec-once=dunst
exec-once=mpd
exec-once=mpDris2

env=QT_QPA_PLATFORM,wayland;xcb
env=QT_STYLE_OVERRIDE,kvantum
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:144,x:1920,y:0
monitorrule=name:^eDP-1$,width:1920,height:1200,refresh:60,x:0,y:0

# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,d,spawn,wmenu-run -f "JetBrainsMono Nerd Font 14" -N 1e2326 -n d3c6aa -M 1e2326 -m d3c6aa -S a7c080 -s 1e2326 -i
bind=SUPER+CTRL,d,spawn,~/.config/hypr/scripts/powermenu.sh
bind=SUPER,v,spawn,~/.config/hypr/scripts/clipboard.sh
bind=SUPER,p,spawn,~/.config/hypr/scripts/playerctl.sh
bind=SUPER,c,spawn,~/.config/hypr/scripts/calc.sh
bind=None,Print,spawn,~/.config/hypr/scripts/grim.sh
bind=SUPER,Return,spawn,foot

# exit
bind=SUPER+shift,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,tab,zoom

# Focus stack
bind=SUPER,k,focusstack,prev
bind=SUPER,j,focusstack,next

# Focus in different direction
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
#bind=SUPER,k,focusdir,up
#bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,j,exchange_stack_client,next
bind=SUPER+CTRL,k,exchange_stack_client,prev

# switch window status
#bind=SUPER+CTRL,g,toggleglobal,
bind=SUPER,O,togglejump,
bind=SUPER,f,togglefloating,
bind=SUPER+CTRL,f,togglefullscreen,

# Cycle through layouts
circle_layout=tile,monocle
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER+CTRL,a,viewtoleft_have_client,0
bind=SUPER+CTRL,s,viewtoright_have_client,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=super+ctrl,1,tag,1,0
bind=super+ctrl,2,tag,2,0
bind=super+ctrl,3,tag,3,0
bind=super+ctrl,4,tag,4,0
bind=super+ctrl,5,tag,5,0
bind=super+ctrl,6,tag,6,0
bind=super+ctrl,7,tag,7,0
bind=super+ctrl,8,tag,8,0
bind=super+ctrl,9,tag,9,0

# monitor switch
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+CTRL,comma,tagmon,left
bind=SUPER+CTRL,period,tagmon,right

# resizewin
bind=CTRL+ALT,K,resizewin,+0,-50
bind=CTRL+ALT,J,resizewin,+0,+50
bind=CTRL+ALT,H,resizewin,-50,+0
bind=CTRL+ALT,L,resizewin,+50,+0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=35
repeat_delay=200
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
border_radius=0
animations=0
layer_animations=0
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xa7c080ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
