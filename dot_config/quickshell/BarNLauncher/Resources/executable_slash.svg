
<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="seamlessSlash" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      
      <rect width="20" height="20" fill="black"/>

      <line x1="0" y1="20" x2="20" y2="0"
            stroke="white"
            stroke-width="3"
            stroke-linecap="square" />

      <line x1="-1" y1="1" x2="1" y2="-1"
            stroke="white"
            stroke-width="3" />
      <line x1="19" y1="21" x2="21" y2="19"
            stroke="white"
            stroke-width="3" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#seamlessSlash)" />
</svg>

