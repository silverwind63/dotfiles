<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define a slash pattern -->
  <defs>
    <pattern id="slashedPattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="5"/>
    </pattern>
  </defs>

  <!-- Rectangle filled with slashes -->
  <rect width="100%" height="100%" fill="url(#slashedPattern)" />
</svg>
