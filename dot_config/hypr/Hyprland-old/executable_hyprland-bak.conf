monitor = HDMI-A-1, 1920x1080@144.01Hz, 0x0, 1
#monitor = HDMI-A-1, preferred, 0x0, 1
#monitor = , preferred, auto, 1, mirror, eDP-1
monitor = eDP-1, preferred, 1920x0, 1

#exec-once = waybar -c /home/chj/.config/waybar/config.json -s /home/chj/.config/waybar/style-chill.css
exec-once = quickshell -p ~/.config/quickshell/Everforest/shell.qml
exec-once = awww-daemon
exec-once = dunst
exec-once = wl-paste --type text image --watch cliphist store 
exec-once = mpd
#exec-once = ags
exec-once = fcitx5
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=~/.config/hypr/scripts/ChangeWorkspace.sh switch 1
exec-once=hyprctl setcursor everforest-cursors 32

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    float_switch_override_focus = 2
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 6
    gaps_out = 6
    border_size = 0
    col.active_border = rgb(b9baa2)
    col.inactive_border = rgb(3c3c3d)

    layout = scrolling

    resize_on_border = true
}

scrolling {
    column_width = 0.5
    focus_fit_method = 1
}

render {
    send_content_type = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper	= 0
    focus_on_activate = false
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    initial_workspace_tracking = 1
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 13
    rounding_power = 10
    blur {
      enabled = false
      size = 9
      passes = 3
      noise = 0.0234
      new_optimizations = on
      special = false
    }

    shadow{
        enabled = true
        range = 10
    }

    dim_special = 0.50
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.14, 0.96, 0.22, 0.91
    bezier = smoothIn, 0.3, 0.9, 0.4, 1.01
    bezier = overshot, 0.05, 0.8, 0.1, 1.1
    bezier = grav, 1, 0.5, 0, 0.5
    bezier = resist, 1, 0, 0, 1

    animation = windows, 1, 3, smoothIn
    animation = windowsOut, 1, 3, smoothIn
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, smoothIn
    animation = workspaces, 1, 3, overshot, slidevert
    animation = specialWorkspace, 1, 2, default, fade
}


master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    mfact = 0.60
    
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
}

group {
    col.border_active = rgba(83a598ff)
    col.border_inactive = rgba(3c3835ff)
    col.border_locked_active = rgba(2e2e2eFF)
    col.border_locked_inactive = rgba(00000000)
    groupbar {
        font_size = 12
        gradients = true
        font_family = MonaspiceNe Nerd Font
        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff00)
        col.active = rgba(a7c08000)
        col.inactive = rgba(7a847800)
        #render_titles = false
    }
}

cursor {
    no_hardware_cursors = true
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = Mod4

# Binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, killactive, 
bind = $mainMod CTRL, Q, forcekillactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, SPACE, togglefloating, 

bindr = $mainMod, D, global, quickshell:Launcher
#bindi = super_l, super_l, global, quickshell:WorkspaceIndicator
#bind = $mainMod, D, exec, rofi -show drun -theme ~/.config/rofi/everforest.rasi

#bind = $mainMod ctrl, D, exec, ~/.config/rofi/powermenu/type-2/powermenu.sh

bindr = $mainMod ctrl, D, global, quickshell:PowerMenu
#bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bindr = $mainMod, V, global, quickshell:Clipboard
bind = $mainMod CTRL, F, fullscreen,
bind = $mainMod, F, fullscreen, 1


# Move focus with mainMod + arrow keys
bind = $mainMod, S, layoutmsg, focus r
bind = $mainMod, A, layoutmsg, focus l
bind = $mainMod, L, layoutmsg, colresize +0.1
bind = $mainMod, H, layoutmsg, colresize -0.1

#bind = $mainMod, K, movefocus, u
#bind = $mainMod, J, movefocus, d

# Move windows with mainMod + arrow keys
bind = $mainMod SHIFT, S, movewindow, l
bind = $mainMod SHIFT, A, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

$switch_script = ~/.config/hypr/scripts/ChangeWorkspace.sh
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, $switch_script switch 1
bind = $mainMod, 2, exec, $switch_script switch 2
bind = $mainMod, 3, exec, $switch_script switch 3
bind = $mainMod, 4, exec, $switch_script switch 4
bind = $mainMod, 5, exec, $switch_script switch 5
bind = $mainMod, 6, exec, $switch_script switch 6
bind = $mainMod, 7, exec, $switch_script switch 7
bind = $mainMod, 8, exec, $switch_script switch 8
bind = $mainMod, 9, exec, $switch_script switch 9
bind = $mainMod, 0, exec, $switch_script switch 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CTRL, 1,exec, $switch_script move 1
bind = $mainMod CTRL, 2,exec, $switch_script move 2
bind = $mainMod CTRL, 3,exec, $switch_script move 3
bind = $mainMod CTRL, 4,exec, $switch_script move 4
bind = $mainMod CTRL, 5,exec, $switch_script move 5
bind = $mainMod CTRL, 6,exec, $switch_script move 6
bind = $mainMod CTRL, 7,exec, $switch_script move 7
bind = $mainMod CTRL, 8,exec, $switch_script move 8
bind = $mainMod CTRL, 9,exec, $switch_script move 9
bind = $mainMod CTRL, 0,exec, $switch_script move 10

# toggle window grouping
#bind = $mainMod, g, togglegroup
#bind = $mainMod, a, changegroupactive, b
#bind = $mainMod, s, changegroupactive, f


$switch_monitor_script = ~/.config/hypr/scripts/ChangeMonitor.sh
# change workspace
bind = $mainMod ctrl, a , workspace, m-1
bind = $mainMod ctrl, s , workspace, m+1
bind = $mainMod, Tab, exec, $switch_monitor_script switch
bind = $mainMod ctrl, Tab, exec, $switch_monitor_script move

#scrolling
#bind = $mainMod CTRL, A , layoutmsg, focus l
#bind = $mainMod CTRL, S , layoutmsg, focus r
#bind = $mainMod, F, layoutmsg,fit active

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Application binds
bind = $mainMod, RETURN, exec, kitty

# Screenshots
bind = $mainMod,Print, exec, grimblast save output
bind = , PRINT, exec, hyprshot -m region -o ~/Pictures

